##################################################
joker_kgs: {stretch_pct: 3.6,  tension_kN: 5, weight_g_m: 10000}
joker_5g: {stretch_pct: 3.6,  tension_kN: 5, weight_g_m: 5}
solid_5g: {stretch_pct: 2.5,  tension_kN: 5, weight_g_m: 5, width_mm: 20}

# As used in the 2024 ISA backup fall experiment 
# pinktube above already carries that paper's values.
hmpe:     {stretch_pct: 3.0,  tension_kN: 10, weight_g_m: 40}
