# Simulation settings. Webbing names refer to webbings.yaml.
plots: true        # open the force plot and the two RopePlayer windows
gif: false           # write example.gif (leash fall animated above backup fall)

anchor_height_left: 11
anchor_height_right: 14
L: 110              # length of highline spot [m]
N: 55               # number of discretization verticies
T: 10               # length of simulation [s]
tension_kN: 1.30  # standing tension (or pull_webbing, exactly one of the two)
# pull_webbing: 0.75  # meters pulled
pull_side: right    # anchor side to pull from
kv_scale: 1.0
drag_scale: 1.0

slackliner:
  m: 89             # mass [kg]
  l_leg: 1.0        # length from harness to feet [m]
  l_leash: 1.2      # length of leash [m]
  x_coor: 55        # x-coordinate of slackliner [m]

segments:
  - {main: joker, backup: solid, L_main: 30, L_backup: 32, break_mainline: true}
  - {main: joker, backup: solid, L_main: 30, L_backup: 32, break_mainline: false}
  - {main: joker, backup: solid, L_main: 50, L_backup: 53, break_mainline: false}
