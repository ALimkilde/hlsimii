# Simulation settings. Webbing names refer to webbings.yaml.
plots: true        # open the force plot and the two RopePlayer windows
gif: false           # write example.gif (leash fall animated above backup fall)

L: 100              # length of highline spot [m]
N: 35               # number of discretization verticies
T: 15                # length of simulation [s]
# tension_kN: 1.35     # standing tension (or pull_webbing, exactly one of the two)
pull_webbing: 3
pull_side: right    # anchor side to pull from

slackliner:
  m: 89             # mass [kg]
  l_leg: 1.1        # length from harness to feet [m]
  l_leash: 1.3      # length of leash [m]
  x_coor: 50        # x-coordinate of slackliner [m]

segments:
  - {main: joker, backup: solid, L_main: 30, L_backup: 32, break_mainline: true}
  - {main: joker, backup: solid, L_main: 30, L_backup: 32, break_mainline: false}
  - {main: joker, backup: solid, L_main: 40, L_backup: 43, break_mainline: false}
