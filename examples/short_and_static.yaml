# Simulation settings. Webbing names refer to webbings.yaml.
plots: false        # open the force plot and the two RopePlayer windows
gif: true           # write example.gif (leash fall animated above backup fall)

L: 50              # length of highline spot [m]
N: 25               # number of discretization verticies
T: 5                # length of simulation [s]
# tension_kN: 1.5     # standing tension (or pull_webbing, exactly one of the two)
# pull_side: right    # anchor side to pull from
pull_webbing: 1       # pull 1 m of webbing

slackliner:
  m: 89             # mass [kg]
  l_leg: 1.1        # length from harness to feet [m]
  l_leash: 1.3      # length of leash [m]
  x_coor: 25        # x-coordinate of slackliner [m]

segments:
  - {main: joker, backup: solid, L_main: 50, L_backup: 53, break_mainline: true}
